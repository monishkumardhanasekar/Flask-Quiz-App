{% extends "base.html" %} {% block content %}
<div style="max-width: 400px; margin: 40px auto">
  <h2>Register</h2>
  <form id="registerForm" class="card" style="margin-top: 20px">
    <div style="margin-bottom: 16px">
      <label for="email" style="display: block; margin-bottom: 6px">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        style="
          width: 100%;
          padding: 10px;
          border-radius: 8px;
          border: 1px solid #2b2b2b;
          background: #141414;
          color: #eee;
          box-sizing: border-box;
        "
      />
    </div>
    <div style="margin-bottom: 16px">
      <label for="password" style="display: block; margin-bottom: 6px">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        style="
          width: 100%;
          padding: 10px;
          border-radius: 8px;
          border: 1px solid #2b2b2b;
          background: #141414;
          color: #eee;
          box-sizing: border-box;
        "
      />
    </div>
    <div id="error" style="color: #ff7f7f; margin-bottom: 12px; display: none"></div>
    <div id="success" style="color: #7cfc98; margin-bottom: 12px; display: none"></div>
    <button type="submit" style="width: 100%">Register</button>
    <div style="margin-top: 16px; text-align: center; color: #bbb">
      Already have an account?
      <a href="/login">Login here</a>
    </div>
  </form>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
      const response = await fetch('http://localhost:8080/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        errorDiv.textContent = data.error || 'Registration failed';
        errorDiv.style.display = 'block';
        return;
      }
      
      successDiv.textContent = 'Registration successful! Redirecting to login...';
      successDiv.style.display = 'block';
      
      // Redirect to login after 1 second
      setTimeout(() => {
        window.location.href = '/login';
      }, 1000);
    } catch (err) {
      errorDiv.textContent = 'Network error. Please try again.';
      errorDiv.style.display = 'block';
    }
  });
</script>
{% endblock %}
